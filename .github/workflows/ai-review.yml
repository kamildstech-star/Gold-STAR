# AI code review with Claude (anthropics/claude-code-action), billed per use
# to the Anthropic API key in the ANTHROPIC_API_KEY repository secret. No
# subscription. Without that secret every job here ends early with a notice
# instead of failing. Setup, cost and the off switches: docs/QUALITY-CONTROL.md.
#
# Three jobs:
#   review       every pull request into main (not drafts, not Dependabot, not
#                docs-only): reads the diff, posts one summary comment and
#                inline comments. Read-only on the code.
#   respond      "@claude ..." in a comment on a pull request or issue, from
#                the owner or a collaborator: answers, or commits a fix to the
#                pull request's branch (or, from an issue, to a new claude/
#                branch with a link to open the pull request).
#   review-main  a commit Lovable (or anyone) pushed straight to main without a
#                pull request: reviews that push's diff and opens an issue
#                labelled ai-review if it finds a real problem.
#
# What Claude can never do here, and what enforces it:
#   - Merge or approve. No job has a tool that can: the review tools are
#     comment-only, and nothing anywhere runs `gh pr merge` or `gh pr review`.
#   - Push to main. review and review-main have read-only contents. respond
#     commits through the action's API commit tool (use_commit_signing), which
#     is bound to the branch the action set up -- the pull request's branch, or
#     a new claude/ branch -- so Claude cannot choose main as the target.
#   - Change workflows or secrets. Every job runs on the workflow's own
#     GITHUB_TOKEN, which GitHub never grants the `workflows` permission, so a
#     commit touching .github/workflows/ is refused by GitHub itself. Secrets
#     are not readable through any token.
name: AI review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]
    # Same list as pull-request-checks.yml: a prose-only change has nothing to
    # review for bugs.
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
      - "docs/**"
      - "LICENSE"
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # The action does not accept a `push` event, so Lovable's direct pushes reach
  # review-main through the checks workflow finishing instead. That also means
  # a docs-only push (which skips the checks) is not reviewed, and the review
  # starts only after the checks have run.
  workflow_run:
    workflows: ["Pull request checks"]
    types: [completed]
    branches: [main]

# Nothing at the top level; each job asks for exactly what it needs.
permissions: {}

env:
  # One place to change the model. Override without a code change by setting
  # the repository variable AI_REVIEW_MODEL (Settings -> Secrets and variables
  # -> Actions -> Variables), e.g. to claude-sonnet-5-5, which costs half as
  # much per token.
  AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'claude-opus-5-5' }}

jobs:
  review:
    name: Claude review
    # Decided before a runner starts, so these skips cost nothing. Pull
    # requests from forks are skipped too: they get no secrets, and nobody
    # outside the repository should be spending its API key. Setting the
    # repository variable AI_REVIEW_ON_SYNC to false reviews a pull request
    # when it is opened, reopened or marked ready, but not on every later push
    # -- the biggest single saving if the bill is too high.
    if: >-
      github.event_name == 'pull_request'
      && vars.AI_REVIEW_DISABLED != 'true'
      && (github.event.action != 'synchronize' || vars.AI_REVIEW_ON_SYNC != 'false')
      && !github.event.pull_request.draft
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    # A new push to the pull request cancels the review of the previous one;
    # only the newest commit's review is worth paying for.
    concurrency:
      group: ai-review-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice title=AI review skipped::The ANTHROPIC_API_KEY repository secret is not set. See docs/QUALITY-CONTROL.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review the diff
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD COMMIT: ${{ github.event.pull_request.head.sha }}

            You are reviewing a pull request to the Gold Star Restoration
            "Recovery Hub" CRM (TanStack Start, React 19, Supabase/Postgres
            with RLS). The PR is checked out in the working directory. CI
            already runs tsc, vitest, the build, ESLint on changed files and
            Semgrep, so do not report type errors, lint or formatting.

            1. Read AGENTS.md and the "Database", "Testing" and "House style"
               sections of .claude/AGENT-BRIEF.md for the repository's rules.
            2. Run `gh pr diff ${{ github.event.pull_request.number }}` and
               `gh pr view ${{ github.event.pull_request.number }}`. Review ONLY
               what the diff changes. Read surrounding files only as needed to
               judge a changed line.
            3. Look for, in this order:
               - Security: RLS bypass or a SECURITY DEFINER function without its
                 own access check; data from another office visible to a viewer
                 without full access; a server function (*.functions.ts) or
                 public route (src/routes/api/public/) missing auth, signature
                 verification or its rate limit; SQL/HTML injection; secrets in
                 code; SSRF (server-side fetch of a user-supplied URL).
               - Sends and retries: an email, SMS, webhook or payment that can
                 be sent twice, or a retry that is not idempotent.
               - Data loss: deletes or overwrites without a guard; migrations
                 that drop or rewrite data; history/audit rows no longer written.
               - Money and quantity maths: rounding, currency, tax, rates, sums.
               - Crashes and regressions: null/undefined paths, unhandled
                 promise rejections, a changed behaviour another caller relies on.
               - Missing tests for changed logic in src/lib (pure logic belongs
                 in src/lib/*.test.ts; there is no DOM testing library).
            4. Post findings:
               - Each concrete problem as an inline comment on the changed line,
                 using mcp__github_inline_comment__create_inline_comment with
                 confirmed: true. Say what breaks and for whom. When the fix is
                 a few lines, include it as a GitHub ```suggestion block so it
                 can be applied with one click.
               - Then exactly ONE top-level comment with
                 `gh pr comment ${{ github.event.pull_request.number }} --body "..."`,
                 starting with "**AI review** of <short commit sha>": a short
                 list of blocking issues (or the words "No blocking issues"),
                 then at most three non-blocking notes. Keep it under 250 words.
                 Mention that a collaborator can reply "@claude fix <what>" to
                 have a fix committed to this branch.
            Report only real, specific problems you can point to in the diff.
            No praise, no style opinions, no restating the diff. Never approve
            or request changes as a formal review, never merge, never push.
          claude_args: |
            --model ${{ env.AI_REVIEW_MODEL }}
            --max-turns 30
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"

  respond:
    name: Claude on request
    # "@claude" from someone the repository trusts: the owner, an organization
    # member or an invited collaborator. Everyone else (and every bot) is
    # skipped before a runner starts. The action repeats the check against the
    # live permission list.
    if: >-
      vars.AI_REVIEW_DISABLED != 'true'
      && (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
      && contains(github.event.comment.body, '@claude')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # commit a requested fix to the PR branch or a claude/ branch
      pull-requests: write # comment on the pull request
      issues: write # comment on the issue
      actions: read # read failing check logs when asked to fix them
    # One request at a time per pull request or issue. A second request waits
    # rather than cancelling a fix that is half committed.
    concurrency:
      group: ai-respond-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    outputs:
      pushed: ${{ steps.after.outputs.pushed }}
      branch: ${{ steps.before.outputs.branch }}
    steps:
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice title=AI review skipped::The ANTHROPIC_API_KEY repository secret is not set. See docs/QUALITY-CONTROL.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Remember the pull request's head so the next steps can tell whether
      # Claude committed to it.
      - name: Note the pull request head
        id: before
        if: steps.key.outputs.present == 'true' && (github.event.issue.pull_request || github.event.pull_request)
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid,headRefName \
            --jq '"sha=\(.headRefOid)\nbranch=\(.headRefName)"' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      # No `prompt`, so the action runs in its interactive mode: the comment is
      # the instruction.
      - name: Answer or fix
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Commits go through the GitHub API to the branch the action chose,
          # never through `git push`. See the header for why that matters.
          use_commit_signing: true
          additional_permissions: |
            actions: read
          claude_args: |
            --model ${{ env.AI_REVIEW_MODEL }}
            --max-turns 40
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
            --append-system-prompt "Before changing code, read AGENTS.md and .claude/AGENT-BRIEF.md and follow them. Keep a fix to what was asked. Never edit anything under .github/, never touch secrets or environment files, never merge, never push to main. CI runs typecheck, tests, lint and Semgrep on your commit afterwards, so say in your reply what you could not verify."

      - name: Did Claude commit to the pull request?
        id: after
        if: always() && steps.before.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
        run: |
          now=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ "$now" != "$BEFORE_SHA" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "The pull request moved from $BEFORE_SHA to $now."
          fi

  # A commit made with the workflow's GITHUB_TOKEN does not start other
  # workflows (GitHub's loop guard), so Claude's fix would otherwise sit on the
  # pull request with no checks. A workflow_dispatch is the one event that
  # token may start, so this asks for the checks on the branch. Its own job so
  # that `actions: write` is held only here, by a job with no AI in it.
  checks-after-fix:
    name: Run checks on Claude's fix
    needs: respond
    if: needs.respond.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # GitHub reads the workflow file from the branch being dispatched, so a
      # branch cut before workflow_dispatch was added to the checks cannot be
      # dispatched. That is a warning, not a failure: push any commit to the
      # branch, or merge main into it, and the checks run as usual.
      - name: Dispatch Pull request checks on the branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.respond.outputs.branch }}
        run: |
          if ! gh workflow run pull-request-checks.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"; then
            echo "::warning title=Checks not started::Could not dispatch Pull request checks on $BRANCH. Push a commit to the branch (or merge main into it) to run them."
          fi

  review-main:
    name: Claude review of a direct push to main
    # Only pushes to main that were NOT a merged pull request -- those were
    # reviewed on the pull request. Same test as pull-request-checks.yml: a
    # squash merge "(#123)" or a "Merge pull request #123" commit, committed by
    # GitHub itself. Checked before a runner starts.
    if: >-
      github.event_name == 'workflow_run'
      && vars.AI_REVIEW_DISABLED != 'true'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && !(github.event.workflow_run.head_commit.committer.email == 'noreply@github.com'
      && (contains(github.event.workflow_run.head_commit.message, '(#')
      || startsWith(github.event.workflow_run.head_commit.message, 'Merge pull request #')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # open the ai-review issue
    # Each push is reviewed once for its own diff; a newer push does not cancel
    # the review of an older one, because they cover different changes.
    concurrency:
      group: ai-review-main-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice title=AI review skipped::The ANTHROPIC_API_KEY repository secret is not set. See docs/QUALITY-CONTROL.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.key.outputs.present == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # The workflow_run event names the pushed commit but not where the push
      # started. The repository activity feed records both ends of every push.
      # If the push is not found there (or was a force push), review just the
      # pushed commit.
      - name: Find the pushed range
        id: range
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          before=$(gh api "repos/$GITHUB_REPOSITORY/activity?ref=refs/heads/main&activity_type=push&per_page=50" \
            --jq "[.[] | select(.after == \"$SHA\")][0].before // empty" 2>/dev/null || true)
          if [ -z "$before" ] || ! git merge-base --is-ancestor "$before" "$SHA" 2>/dev/null; then
            before=$(git rev-parse "$SHA^1")
          fi
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "Reviewing $before..$SHA"

      - name: Make sure the ai-review label exists
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ai-review --repo "$GITHUB_REPOSITORY" --color D93F0B \
            --description "Problem found by the AI review of a direct push to main" 2>/dev/null || true

      - name: Review the push
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The review's conclusion appears on the run's summary page, so "No
          # blocking issues" is visible without an issue being opened.
          display_report: "true"
          prompt: |
            REPO: ${{ github.repository }}
            RANGE: ${{ steps.range.outputs.before }}..${{ github.event.workflow_run.head_sha }}
            CHECKS RESULT: ${{ github.event.workflow_run.conclusion }}

            These commits were pushed straight to main of the Gold Star
            Restoration "Recovery Hub" CRM (usually by Lovable, an AI editor),
            with no pull request and no human review. They are already live.
            CI ran typecheck, tests, build, changed-file lint and Semgrep on
            them (result above), so do not report type errors, lint or
            formatting.

            1. Read AGENTS.md and the "Database" section of
               .claude/AGENT-BRIEF.md.
            2. Run `git log --format="%h %an %s" RANGE` and `git diff RANGE`
               (substitute RANGE). Review ONLY what changed.
            3. Look for: RLS bypass or a SECURITY DEFINER function without its
               own access check; another office's data exposed; a server
               function or public route without auth, signature check or rate
               limit; injection; secrets in code; SSRF; double sends or
               non-idempotent retries; data loss (destructive migrations,
               overwrites, audit/history no longer written); wrong money or
               quantity maths; crashes; regressions of existing behaviour.
            4. If you found at least one real, specific problem: first run
               `gh issue list --label ai-review --state all --search "<first 7 characters of the head commit>"`
               and stop if an issue for this commit already exists. Otherwise
               open ONE issue with
               `gh issue create --label ai-review --title "AI review: <what is wrong> (<short sha>)" --body "..."`.
               The body lists each problem with file and line, what breaks and
               for whom, and the smallest fix, and ends with: "Reply
               `@claude fix` on this issue to have a fix prepared on a new
               branch."
            5. If you found nothing blocking, open no issue; end with the words
               "No blocking issues" and one line on what the push changed.
            Report only problems you can point to in the diff. Never edit files,
            never commit, never push.
          claude_args: |
            --model ${{ env.AI_REVIEW_MODEL }}
            --max-turns 30
            --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh issue list:*),Bash(gh issue create:*),Read,Glob,Grep"
