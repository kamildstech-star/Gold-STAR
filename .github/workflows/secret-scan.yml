name: Secret scan
# Mark: "Keep it. It's only taking ~10-20 seconds." Kept in full, push to main
# included -- this is the one check cheap enough to leave as a net under a
# direct push that bypassed a pull request, and it scans reachable history
# rather than the diff, so a run on main is not simply a repeat of the PR run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
# Cancel the previous scan when the same PR gets another push. A scan of main
# that is overtaken by the next push to main is cancelled too, which is fine:
# the newer run covers everything the older one would have.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified scanner
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan reachable history without printing credentials
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --log-opts="--all"'
